name: Validation and Promotion

on:
  # Both branches run every check; only validated develop pushes promote to master.
  push:
    branches: [develop, master]
  # Pull requests run the same checks but never promote or deploy.
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-checks:
    name: Security Checks
    permissions:
      actions: read
      contents: write
      security-events: write
    uses: ./.github/workflows/security.yml

  repository-license-notices:
    name: Repository License Notices
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check Repository License Notices
        run: python3 .github/scripts/check-licenses.py

  landing-site-checks:
    name: Landing Site Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check Landing Site
        run: python3 .github/scripts/check-landing.py

  android-build-and-unit-tests:
    name: Android Build and Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK Platform 37
        run: android sdk install platforms/android-37

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Android App
        run: ./gradlew :androidApp:build --stacktrace

      # The baseline profile generator runs only on a device, so CI compiles and lints it to keep it working.
      - name: Build Baseline Profile Module
        run: ./gradlew :baselineprofile:assemble :baselineprofile:ktlintCheck :baselineprofile:detekt --stacktrace

      # The shared module holds most app code; :androidApp:build lints only its own module.
      - name: Lint Shared Module
        run: ./gradlew :shared:ktlintCheck :shared:detekt --stacktrace

      - name: Run Android Unit Tests
        run: ./gradlew :androidApp:testDebugUnitTest :shared:testAndroidHostTest --stacktrace

  web-app-build:
    name: Web App Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORG_GRADLE_PROJECT_BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate Web Configuration
        if: github.event_name == 'push'
        run: |
          if [ -z "$ORG_GRADLE_PROJECT_BACKEND_BASE_URL" ]; then
            echo "Repository secret BACKEND_BASE_URL is required." >&2
            exit 1
          fi

      - name: Build Web App
        run: ./gradlew :webApp:wasmJsBrowserDistribution --stacktrace

      # The page's content security policy and the Cloudflare Pages headers are the browser's main defenses. Fail when
      # a change weakens them; a deliberate change updates this check together with the policy.
      - name: Check Web Security Policy
        working-directory: webApp/build/dist/wasmJs/productionExecutable
        run: |
          fail() { echo "$1" >&2; exit 1; }
          policies="$(tr '\n' ' ' < index.html \
            | grep -o 'http-equiv="Content-Security-Policy"[[:space:]]*content="[^"]*"' \
            | sed 's/.*content="//; s/"$//')"
          [ "$(printf '%s\n' "$policies" | grep -c .)" -eq 1 ] \
            || fail "index.html must set exactly one content security policy."
          directive() { printf '%s' "$policies" | tr ';' '\n' | sed -n "s/^ *$1 //p"; }
          [ "$(directive script-src)" = "'self' 'wasm-unsafe-eval'" ] \
            || fail "script-src must stay 'self' 'wasm-unsafe-eval'."
          [ "$(directive default-src)" = "'self'" ] || fail "default-src must stay 'self'."
          [ "$(directive object-src)" = "'none'" ] || fail "object-src must stay 'none'."
          [ "$(directive base-uri)" = "'self'" ] || fail "base-uri must stay 'self'."
          if printf '%s' "$policies" | grep -Eq "'unsafe-eval'|(^| )(\*|https?:|https?://\*[^ ;]*)( |;|$)"; then
            fail "The content security policy must not allow eval or wildcard sources."
          fi
          for header in "Content-Security-Policy: frame-ancestors 'none'" "X-Frame-Options: DENY" \
            "X-Content-Type-Options: nosniff" "Strict-Transport-Security: max-age=31536000"; do
            grep -qxF "  $header" _headers || fail "_headers must send $header for every page."
          done

      # Runs the common tests in headless Chrome, which the Ubuntu runner provides.
      - name: Run Shared Web Tests
        run: ./gradlew :shared:wasmJsBrowserTest --stacktrace

      - name: Store Validated Web App
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: web-app-production
          path: webApp/build/dist/wasmJs/productionExecutable
          retention-days: 1

  android-instrumented-tests:
    name: Android Instrumented Tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        # Cover the minimum supported version and a modern Android runtime.
        api-level: [24, 35]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK Platform 37
        run: android sdk install platforms/android-37

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Android Instrumented Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: Nexus 6
          script: ./gradlew :androidApp:connectedCheck --stacktrace

  ios-framework-validation:
    name: iOS Framework Validation
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Shared iOS Framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      # Uses an iPhone simulator that exists on this runner's Xcode, rather than a fixed model name.
      - name: Run Shared iOS Tests
        run: |
          # awk reads the whole list, so xcrun never sees a closed pipe.
          simulator="$(xcrun simctl list devices available | awk '/iPhone/ && !found { sub(/^ +/, ""); sub(/ \(.*/, ""); print; found = 1 }')"
          test -n "$simulator"
          ./gradlew :shared:iosSimulatorArm64Test -PiosTestSimulator="$simulator" --stacktrace

  promote-to-master:
    name: Promote Develop to Master
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - security-checks
      - repository-license-notices
      - landing-site-checks
      - android-build-and-unit-tests
      - android-instrumented-tests
      - web-app-build
      - ios-framework-validation
    # Only develop pushes change master; direct master pushes validate in place.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: write
    outputs:
      before_sha: ${{ steps.promote.outputs.before_sha }}

    steps:
      # Git credentials are needed only in this trusted promotion job, which runs no project code.
      - name: Checkout Code # zizmor: ignore[artipacked]
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push Changes to Master
        id: promote
        # Fast-forward master to the validated develop commit without rewriting history.
        run: |
          before_sha="$(git rev-parse --verify refs/remotes/origin/master 2>/dev/null || true)"
          if [ -n "$before_sha" ] && ! git merge-base --is-ancestor "$before_sha" HEAD; then
            echo "::error::Master cannot fast-forward to this revision. Merge master into develop and rerun validation."
            exit 1
          fi
          echo "before_sha=$before_sha" >> "$GITHUB_OUTPUT"
          git push origin HEAD:refs/heads/master

  publish-promoted-frontend-release:
    name: Publish Promoted Frontend Release
    needs: promote-to-master
    if: github.event_name == 'push'
    permissions:
      contents: write
    uses: ./.github/workflows/release-frontend.yml
    with:
      source_sha: ${{ github.sha }}

  publish-master-frontend-release:
    name: Publish Validated Master Frontend Release
    needs:
      - security-checks
      - repository-license-notices
      - landing-site-checks
      - android-build-and-unit-tests
      - android-instrumented-tests
      - web-app-build
      - ios-framework-validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    uses: ./.github/workflows/release-frontend.yml
    with:
      source_sha: ${{ github.sha }}

  publish-promoted-web-app:
    name: Publish Promoted Web App
    needs:
      - promote-to-master
      - web-app-build
    if: github.event_name == 'push'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/publish-web-app.yml
    with:
      promoted: true
      artifact_name: web-app-production
    secrets:
      BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  publish-master-web-app:
    name: Publish Validated Master Web App
    needs:
      - security-checks
      - repository-license-notices
      - landing-site-checks
      - android-build-and-unit-tests
      - android-instrumented-tests
      - web-app-build
      - ios-framework-validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/publish-web-app.yml
    with:
      artifact_name: web-app-production
    secrets:
      BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  publish-promoted-landing:
    name: Publish Promoted Landing Site
    needs:
      - promote-to-master
      - landing-site-checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write

    steps:
      # The promotion push starts no master run, but a dispatch does, so the site deploys from master.
      - name: Dispatch Landing Deployment on Master
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run publish-landing.yml --ref master

  publish-master-landing:
    name: Publish Validated Master Landing Site
    needs:
      - security-checks
      - repository-license-notices
      - landing-site-checks
      - android-build-and-unit-tests
      - android-instrumented-tests
      - web-app-build
      - ios-framework-validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-landing.yml
