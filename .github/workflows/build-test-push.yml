name: Validation and Promotion

on:
  # Both branches run every check; only validated develop pushes promote to master.
  push:
    branches: [develop, master]
  # Pull requests run the same checks but never promote or deploy.
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-checks:
    name: Security Checks
    permissions:
      actions: read
      contents: write
      security-events: write
    uses: ./.github/workflows/security.yml

  repository-license-notices:
    name: Repository License Notices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check Repository License Notices
        run: python3 .github/scripts/check-licenses.py

  android-build-and-unit-tests:
    name: Android Build and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK Platform 37
        run: android sdk install platforms/android-37

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Android App
        run: ./gradlew :androidApp:build --stacktrace

      - name: Run Android Unit Tests
        run: ./gradlew :androidApp:testDebugUnitTest :shared:testAndroidHostTest --stacktrace

  web-app-build:
    name: Web App Build
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate Web Configuration
        if: github.event_name == 'push'
        run: |
          if [ -z "$ORG_GRADLE_PROJECT_BACKEND_BASE_URL" ]; then
            echo "Repository secret BACKEND_BASE_URL is required." >&2
            exit 1
          fi

      - name: Build Web App
        run: ./gradlew :webApp:wasmJsBrowserDistribution --stacktrace

      - name: Store Validated Web App
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: web-app-production
          path: webApp/build/dist/wasmJs/productionExecutable
          retention-days: 1

  android-instrumented-tests:
    name: Android Instrumented Tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Cover the minimum supported version and a modern Android runtime.
        api-level: [24, 35]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK Platform 37
        run: android sdk install platforms/android-37

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Android Instrumented Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: Nexus 6
          script: ./gradlew :androidApp:connectedCheck --stacktrace

  ios-framework-validation:
    name: iOS Framework Validation
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Shared iOS Framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace

  backend-validation:
    name: Backend Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:8-alpine
        ports:
          - "127.0.0.1:6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and Package Backend
        run: ./gradlew :backend:build :backend:installDist --stacktrace

      - name: Build Backend Container
        run: docker build -f backend/Dockerfile -t braindance-backend:validation backend

      - name: Smoke Test Backend Container
        run: |
          docker run --rm --entrypoint sh braindance-backend:validation -c 'test ! -e /usr/bin/pebble'
          container="$(docker run --detach --publish 127.0.0.1::8080 \
            --env IGDB_RATE_LIMITER=in-memory braindance-backend:validation)"
          trap 'docker rm --force "$container" >/dev/null' EXIT
          port="$(docker port "$container" 8080/tcp | cut -d: -f2)"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' backend/build.gradle.kts)"
          test -n "$version"
          health="$(curl --fail --silent --connect-timeout 2 --max-time 5 \
            --retry 10 --retry-all-errors --retry-delay 1 --retry-max-time 30 \
            "http://127.0.0.1:$port/health")"
          printf '%s' "$health" | python3 -c \
            'import json, sys; assert json.load(sys.stdin) == {"ok": True, "version": sys.argv[1]}' "$version"

      - name: Scan Backend Container
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: braindance-backend:validation
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table
          cache: false

  promote-to-master:
    name: Promote Develop to Master
    runs-on: ubuntu-latest
    needs:
      - security-checks
      - repository-license-notices
      - android-build-and-unit-tests
      - android-instrumented-tests
      - web-app-build
      - ios-framework-validation
      - backend-validation
    # Only develop pushes change master; direct master pushes validate in place.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: write
    outputs:
      before_sha: ${{ steps.promote.outputs.before_sha }}

    steps:
      # Git credentials are needed only in this trusted promotion job, which runs no project code.
      - name: Checkout Code # zizmor: ignore[artipacked]
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push Changes to Master
        id: promote
        # Fast-forward master to the validated develop commit without rewriting history.
        run: |
          before_sha="$(git rev-parse --verify refs/remotes/origin/master 2>/dev/null || true)"
          if [ -n "$before_sha" ] && ! git merge-base --is-ancestor "$before_sha" HEAD; then
            echo "::error::Master cannot fast-forward to this revision. Merge master into develop and rerun validation."
            exit 1
          fi
          echo "before_sha=$before_sha" >> "$GITHUB_OUTPUT"
          git push origin HEAD:refs/heads/master

  publish-promoted-backend:
    name: Publish and Deploy Promoted Backend
    needs: promote-to-master
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/publish-backend.yml
    with:
      before_sha: ${{ needs.promote-to-master.outputs.before_sha }}
    secrets:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      GCP_CLOUD_RUN_SERVICE: ${{ secrets.GCP_CLOUD_RUN_SERVICE }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

  publish-master-backend:
    name: Publish and Deploy Validated Master Backend
    needs:
      - security-checks
      - repository-license-notices
      - android-build-and-unit-tests
      - android-instrumented-tests
      - web-app-build
      - ios-framework-validation
      - backend-validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/publish-backend.yml
    with:
      before_sha: ${{ github.event.before }}
    secrets:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      GCP_CLOUD_RUN_SERVICE: ${{ secrets.GCP_CLOUD_RUN_SERVICE }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

  publish-promoted-frontend-release:
    name: Publish Promoted Frontend Release
    needs: promote-to-master
    if: github.event_name == 'push'
    permissions:
      contents: write
    uses: ./.github/workflows/release-frontend.yml
    with:
      source_sha: ${{ github.sha }}

  publish-master-frontend-release:
    name: Publish Validated Master Frontend Release
    needs:
      - security-checks
      - repository-license-notices
      - android-build-and-unit-tests
      - android-instrumented-tests
      - web-app-build
      - ios-framework-validation
      - backend-validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    uses: ./.github/workflows/release-frontend.yml
    with:
      source_sha: ${{ github.sha }}

  publish-promoted-web-app:
    name: Publish Promoted Web App
    needs:
      - promote-to-master
      - web-app-build
    if: github.event_name == 'push'
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/publish-web-app.yml
    with:
      promoted: true
      artifact_name: web-app-production
    secrets:
      BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}

  publish-master-web-app:
    name: Publish Validated Master Web App
    needs:
      - security-checks
      - repository-license-notices
      - android-build-and-unit-tests
      - android-instrumented-tests
      - web-app-build
      - ios-framework-validation
      - backend-validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/publish-web-app.yml
    with:
      artifact_name: web-app-production
    secrets:
      BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
