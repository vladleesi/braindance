name: Security Checks

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

jobs:
  dependency-graph:
    name: Resolve Dependency Snapshots
    # Fork PR snapshots are generated by the independent pull_request workflow.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/dependency-graph.yml

  dependency-submission:
    name: Submit Dependency Snapshots
    needs: dependency-graph
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/dependency-submission.yml

  codeql:
    name: CodeQL Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK Platform 37
        run: android sdk install platforms/android-37

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
          config-file: ./.github/codeql-config.yml

      - name: Compile Backend and Android Sources for Analysis
        # Kotlin extraction needs compiler execution, including shared Android sources.
        run: >-
          ./gradlew :backend:classes :androidApp:assembleDebug
          --no-configuration-cache --no-build-cache --rerun-tasks --stacktrace

      - name: Analyze Kotlin
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
          output: codeql-results

      - name: Block High and Critical CodeQL Findings
        run: python3 .github/scripts/check-codeql-results.py codeql-results

  dependency-review:
    name: Dependency Review
    needs: dependency-submission
    if: >-
      !cancelled() && (github.event_name == 'pull_request' || needs.dependency-submission.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Select Dependency Comparison
        id: comparison
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          head_sha="${PR_HEAD_SHA:-$GITHUB_SHA}"
          base_sha="${PR_BASE_SHA:-${PUSH_BASE_SHA:-$head_sha}}"
          if [[ "$base_sha" =~ ^0+$ ]]; then base_sha="$head_sha"; fi
          echo "base=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Review Dependency Changes
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          base-ref: ${{ steps.comparison.outputs.base }}
          head-ref: ${{ steps.comparison.outputs.head }}
          license-check: false
          comment-summary-in-pr: never
          # The independent graph workflow also handles PRs from public forks.
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 900

      - name: Require Complete Dependency Snapshots
        # Dependency Review otherwise proceeds with partial data after its retry timeout.
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.comparison.outputs.base }}
          HEAD_SHA: ${{ steps.comparison.outputs.head }}
        run: |
          headers="$RUNNER_TEMP/dependency-snapshot-headers"
          gh api --include --silent --paginate \
            "repos/$GITHUB_REPOSITORY/dependency-graph/compare/$BASE_SHA...$HEAD_SHA" > "$headers"
          if grep -Eiq '^x-github-dependency-graph-snapshot-warnings:[[:space:]]*[^[:space:]]' "$headers"; then
            echo "::error::Dependency snapshots are incomplete. Check graph generation and submission, then rerun."
            exit 1
          fi

  workflow-security:
    name: GitHub Actions Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Workflows
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Audit GitHub Actions
        uses: zizmorcore/zizmor-action@v0.8.0
        with:
          advanced-security: false
          annotations: true
          min-severity: medium

  scheduled-container-scan:
    name: Scheduled Backend Image Scan
    # Pushes and PRs scan their image in Backend Validation; publication scans again before pushing.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Package Backend
        run: ./gradlew :backend:installDist --stacktrace

      - name: Build Backend Container
        run: docker build -f backend/Dockerfile -t braindance-backend:security backend

      - name: Scan Backend Container
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: braindance-backend:security
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table
          cache: false
