name: Publish and Deploy Backend

on:
  workflow_dispatch:
  # Validation calls this for master pushes and GITHUB_TOKEN promotions.
  workflow_call:
    inputs:
      before_sha:
        description: Master revision before the validated push or promotion
        required: true
        type: string
    secrets:
      GCP_PROJECT_ID:
        required: false
      GCP_REGION:
        required: false
      GCP_CLOUD_RUN_SERVICE:
        required: false
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: false
      GCP_DEPLOY_SERVICE_ACCOUNT:
        required: false

permissions:
  contents: read

concurrency:
  group: backend-publication
  cancel-in-progress: false

jobs:
  changes:
    name: Check Backend Changes
    if: github.ref == 'refs/heads/master' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}
      source_sha: ${{ steps.changes.outputs.source_sha }}
    steps:
      # Retain read-only Git authentication for the baseline fetch; this job runs no project code.
      - name: Checkout Backend Revision # zizmor: ignore[artipacked]
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'master' || github.sha }}

      - name: Detect Backend Changes
        id: changes
        env:
          BEFORE_SHA: ${{ inputs.before_sha }}
        run: |
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BEFORE_SHA" ] || \
            [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
          # These root inputs also affect backend compilation and build checks.
          if git diff --quiet "$BEFORE_SHA" HEAD -- backend/ \
            build.gradle.kts settings.gradle.kts gradle.properties gradlew gradlew.bat \
            gradle/wrapper/ gradle/libs.versions.toml .editorconfig config/detekt-config.yml \
            config/detekt-nullability.yml; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish Backend Image
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      redis:
        image: redis:8-alpine
        ports:
          - "127.0.0.1:6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - name: Checkout Validated Revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.changes.outputs.source_sha }}

      - name: Read Backend Version
        id: backend-version
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' backend/build.gradle.kts)"
          if [ -z "$version" ]; then
            echo "Backend version is missing." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and Package Backend
        run: ./gradlew :backend:build :backend:installDist --stacktrace

      - name: Build Backend Image
        id: image
        env:
          IMAGE: ghcr.io/${{ github.repository }}/backend
          BACKEND_VERSION: ${{ steps.backend-version.outputs.value }}
          SOURCE_SHA: ${{ needs.changes.outputs.source_sha }}
        run: |
          image="$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          docker build -f backend/Dockerfile -t "$image:$BACKEND_VERSION" -t "$image:$SOURCE_SHA" backend
          echo "name=$image" >> "$GITHUB_OUTPUT"

      - name: Scan Backend Image Before Publication
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ needs.changes.outputs.source_sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table
          cache: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Scanned Backend Image
        id: publish
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          BACKEND_VERSION: ${{ steps.backend-version.outputs.value }}
          SOURCE_SHA: ${{ needs.changes.outputs.source_sha }}
        run: |
          image="$IMAGE"
          docker push "$image:$BACKEND_VERSION"
          docker push "$image:${SOURCE_SHA}"
          published_image="$(docker image inspect "$image:${SOURCE_SHA}" --format '{{index .RepoDigests 0}}')"
          echo "image=$published_image" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy Published Backend
    needs: [changes, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      GCP_CLOUD_RUN_SERVICE: ${{ secrets.GCP_CLOUD_RUN_SERVICE }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      PUBLISHED_IMAGE: ${{ needs.publish.outputs.image }}
      SOURCE_SHA: ${{ needs.changes.outputs.source_sha }}
    steps:
      # Retain read-only Git authentication to check the current master revision before deployment.
      - name: Checkout Published Revision # zizmor: ignore[artipacked]
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.source_sha }}

      - name: Check Deployment Configuration and Source Revision
        id: validate
        run: |
          for name in GCP_PROJECT_ID GCP_REGION GCP_CLOUD_RUN_SERVICE \
            GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT; do
            if [ -z "${!name}" ]; then
              echo "Repository secret $name is required for deployment." >&2
              exit 1
            fi
          done
          if [[ "$GCP_WORKLOAD_IDENTITY_PROVIDER" =~ projects/([0-9]+)/ ]]; then
            printf '::add-mask::%s\n' "${BASH_REMATCH[1]}"
          fi
          master_sha="$(git ls-remote origin refs/heads/master | cut -f1)"
          if [ "$master_sha" != "$SOURCE_SHA" ]; then
            echo "::notice::Skipping deployment because master has advanced past the published revision."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate to Google Cloud
        if: steps.validate.outputs.current == 'true'
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Set up Google Cloud CLI
        if: steps.validate.outputs.current == 'true'
        uses: google-github-actions/setup-gcloud@v3
      - name: Update existing Cloud Run image
        if: steps.validate.outputs.current == 'true'
        run: |
          umask 077
          if ! gcloud run services update "$GCP_CLOUD_RUN_SERVICE" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --image "$PUBLISHED_IMAGE" \
              --quiet > "$RUNNER_TEMP/cloud-run-update.log" 2>&1; then
            echo "::error::Cloud Run image update failed. Inspect the private Google Cloud deployment logs."
            exit 1
          fi
