name: Frontend Release

on:
  # Validation calls this only after all checks pass for the exact source revision.
  workflow_call:
    inputs:
      source_sha:
        description: Validated master revision to release
        required: true
        type: string
    outputs:
      created:
        description: Whether this run created the frontend release, so testers get each release once
        value: ${{ jobs.publish-frontend-release.outputs.created }}
    # A reusable workflow reads only declared secrets. Without it, releases are still published and just not announced.
    secrets:
      DISCORD_RELEASE_WEBHOOK_URL:
        required: false

permissions: {}

concurrency:
  group: frontend-release
  cancel-in-progress: false

jobs:
  publish-frontend-release:
    name: Publish Android, iOS, and Web Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      created: ${{ steps.publish.outputs.created }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      # This trusted release job fetches Git refs and runs no project build code.
      - name: Checkout Validated Revision # zizmor: ignore[artipacked]
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Check Source Revision
        id: source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          git fetch origin master --no-tags
          if [ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]; then
            echo "Checkout does not match the validated source revision." >&2
            exit 1
          fi
          if [ "$(git rev-parse origin/master)" != "$SOURCE_SHA" ]; then
            echo "::notice::Skipping release because master has advanced past the validated revision."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read Frontend Version
        if: steps.source.outputs.current == 'true'
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^MARKETING_VERSION[[:space:]]*=[[:space:]]*//p' version.xcconfig)"
          build_number="$(sed -n 's/^CURRENT_PROJECT_VERSION[[:space:]]*=[[:space:]]*//p' version.xcconfig)"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid frontend version: $version" >&2
            exit 1
          fi
          if [[ ! "$build_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid frontend build number: $build_number" >&2
            exit 1
          fi

          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "tag=app-v$version" >> "$GITHUB_OUTPUT"

      - name: Check Frontend Release
        # Each version is released once: the first time it reaches master with all checks passing, even when an earlier
        # push of the same version failed validation. The full-history checkout includes every tag.
        if: steps.source.outputs.current == 'true'
        id: release-check
        env:
          FRONTEND_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$FRONTEND_TAG"; then
            echo "::notice::Skipping frontend release because $FRONTEND_TAG already exists."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        id: publish
        if: steps.source.outputs.current == 'true' && steps.release-check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FRONTEND_VERSION: ${{ steps.version.outputs.name }}
          FRONTEND_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          FRONTEND_TAG: ${{ steps.version.outputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if gh release view "$FRONTEND_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $FRONTEND_TAG already exists."
            exit 0
          fi

          if git show-ref --verify --quiet "refs/tags/$FRONTEND_TAG"; then
            if [ "$(git rev-parse "$FRONTEND_TAG^{commit}")" != "$SOURCE_SHA" ]; then
              echo "Tag $FRONTEND_TAG points to another revision. Increment the frontend version." >&2
              exit 1
            fi
          fi

          notes_file="$RUNNER_TEMP/frontend-release-notes.md"
          changelog_entry="$RUNNER_TEMP/frontend-changelog-entry.md"
          # Entry headings are "## MAJOR.MINOR.PATCH — YYYY-MM-DD"; the version field alone identifies the entry.
          if ! awk -v version="$FRONTEND_VERSION" '
            $1 == "##" && $2 == version { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$changelog_entry"; then
            echo "CHANGELOG.md is missing the entry for $FRONTEND_VERSION." >&2
            exit 1
          fi
          platform_heading='^### (Android|iOS|Web|Android and (iOS|Web)|iOS and Web|Android, iOS, and Web)$'
          if ! grep -Eq "$platform_heading" "$changelog_entry" || \
            ! grep -Eq '^- .+' "$changelog_entry"; then
            echo "The changelog entry must include platform headings and change bullets." >&2
            exit 1
          fi
          {
            printf 'Android, iOS, and Web release %s. Build number: %s.\n\n' \
              "$FRONTEND_VERSION" "$FRONTEND_BUILD_NUMBER"
            cat "$changelog_entry"
          } > "$notes_file"

          gh release create "$FRONTEND_TAG" \
            --target "$SOURCE_SHA" \
            --title "Braindance App $FRONTEND_VERSION" \
            --notes-file "$notes_file"
          echo "created=true" >> "$GITHUB_OUTPUT"

  announce-release:
    name: Announce Release in Discord
    needs: publish-frontend-release
    if: needs.publish-frontend-release.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The release already exists, and this workflow's result gates tester builds, so a failed post must not fail it.
    continue-on-error: true
    # This job holds the webhook and a read-only token; the job that writes releases never sees the webhook. The
    # environment is limited to the master and develop branches and stores DISCORD_RELEASE_WEBHOOK_URL.
    environment: discord-release
    permissions:
      contents: read

    steps:
      - name: Post Release Notes
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          FRONTEND_TAG: ${{ needs.publish-frontend-release.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$DISCORD_RELEASE_WEBHOOK_URL" ]; then
            echo "::notice::Skipping Discord announcement: DISCORD_RELEASE_WEBHOOK_URL is not set."
            exit 0
          fi
          if [[ ! "$DISCORD_RELEASE_WEBHOOK_URL" =~ ^https://(discord|discordapp)\.com/api/webhooks/[0-9]+/[A-Za-z0-9_-]+$ ]]; then
            echo "DISCORD_RELEASE_WEBHOOK_URL is not a Discord webhook URL." >&2
            exit 1
          fi
          if [[ ! "$FRONTEND_TAG" =~ ^app-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected release tag: $FRONTEND_TAG" >&2
            exit 1
          fi

          # The release body is "Android, iOS, and Web release X. Build number: N." followed by the changelog entry.
          # Drop that first line, turn headings into bold, and trim leading blank lines. The changelog wraps at 120
          # characters and Discord keeps every line break, so indented continuation lines join their bullet.
          text="$(gh release view "$FRONTEND_TAG" --repo "$REPOSITORY" --json body --jq .body | tr -d '\r' \
            | awk 'NR == 1 && /^Android, iOS, and Web release / { next } { print }' \
            | sed -E 's/^### (.+)$/**\1**/' | awk 'NF { started = 1 } started' \
            | awk '/^ +[^ ]/ && open { sub(/^ +/, ""); line = line " " $0; next }
                   { if (open) print line; line = $0; open = 1 }
                   END { if (open) print line }')"
          if [ -z "$text" ]; then
            echo "Release $FRONTEND_TAG has no notes to announce." >&2
            exit 1
          fi

          # Discord embeds hold 4096 characters. Cut at a line boundary well below that and link the full notes.
          release_url="https://github.com/$REPOSITORY/releases/tag/$FRONTEND_TAG"
          payload="$RUNNER_TEMP/discord-release.json"
          jq -n \
            --arg title "Braindance App ${FRONTEND_TAG#app-v}" \
            --arg url "$release_url" \
            --arg text "$text" '
              reduce ($text | split("\n"))[] as $line ({out: [], size: 0, cut: false};
                if .cut then .
                elif .size + ($line | length) + 1 > 3800 then .cut = true
                else .out += [$line] | .size += ($line | length) + 1
                end)
              | ((.out | join("\n")) + (if .cut then "\n…" else "" end)) as $body
              | {
                  allowed_mentions: {parse: []},
                  embeds: [{
                    title: $title,
                    url: $url,
                    description: ($body + "\n\n[Full release notes](" + $url + ")"),
                    footer: {text: "Source release. Mobile store downloads may not be available yet."}
                  }]
                }' > "$payload"
          curl --fail-with-body --silent --show-error --max-time 30 \
            --header 'Content-Type: application/json' --data @"$payload" "$DISCORD_RELEASE_WEBHOOK_URL"
