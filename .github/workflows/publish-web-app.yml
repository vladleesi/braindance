name: Master Web App Publication

on:
  # Validation gates both direct master pushes and GITHUB_TOKEN promotions.
  workflow_call:
    inputs:
      promoted:
        description: Publish the master revision promoted from develop
        required: false
        type: boolean
        default: false
      artifact_name:
        description: Validated web app artifact to publish without rebuilding
        required: false
        type: string
        default: ''
    secrets:
      BACKEND_BASE_URL:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions: {}

concurrency:
  group: web-app-publication
  cancel-in-progress: true

jobs:
  publish-web-app:
    name: Deploy Web App to Cloudflare Pages
    # Validation calls this after a successful promotion or a validated master push.
    if: inputs.promoted || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    env:
      ORG_GRADLE_PROJECT_BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
      DIST_DIR: webApp/build/dist/wasmJs/productionExecutable

    steps:
      - name: Checkout Master
        uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: false

      - name: Validate Web Configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          missing=0
          for name in ORG_GRADLE_PROJECT_BACKEND_BASE_URL CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "Repository secret ${name#ORG_GRADLE_PROJECT_} is required." >&2
              missing=1
            fi
          done
          if [ -z "$CLOUDFLARE_PAGES_PROJECT" ]; then
            echo "Repository variable CLOUDFLARE_PAGES_PROJECT is required." >&2
            missing=1
          fi
          exit "$missing"

      - name: Set up JDK 21
        if: inputs.artifact_name == ''
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # A deploying job never restores caches that other runs could have written.
      - name: Set up Gradle
        if: inputs.artifact_name == ''
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Build Production Web App
        if: inputs.artifact_name == ''
        run: ./gradlew :webApp:wasmJsBrowserDistribution --stacktrace

      - name: Download Validated Web App
        if: inputs.artifact_name != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ env.DIST_DIR }}

      # Cloudflare Pages serves index.html for unknown paths only when the site has no top-level 404.html, and the page
      # must load the content-hashed bundle that _headers lets browsers cache forever.
      - name: Check Web App Files
        run: |
          cd "$DIST_DIR"
          test -f index.html || { echo "index.html is missing." >&2; exit 1; }
          test -f _headers || { echo "_headers is missing." >&2; exit 1; }
          if [ -e 404.html ]; then
            echo "404.html would turn off single-page routing on Cloudflare Pages." >&2
            exit 1
          fi
          bundle="$(grep -o 'src="webApp\.[0-9a-f]*\.js"' index.html | sed 's/^src="//; s/"$//')"
          if [ -z "$bundle" ] || [ ! -f "$bundle" ]; then
            echo "index.html must load an existing content-hashed webApp bundle." >&2
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.158.0'
          command: >-
            pages deploy ${{ env.DIST_DIR }}
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=master
            --commit-hash=${{ github.sha }}
            --commit-dirty=true
