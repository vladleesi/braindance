name: Master Web App Publication

on:
  # Validation gates both direct master pushes and GITHUB_TOKEN promotions.
  workflow_call:
    inputs:
      promoted:
        description: Publish the master revision promoted from develop
        required: false
        type: boolean
        default: false
      artifact_name:
        description: Validated web app artifact to publish without rebuilding
        required: false
        type: string
        default: ''
    secrets:
      BACKEND_BASE_URL:
        required: false

permissions: {}

concurrency:
  group: web-app-publication
  cancel-in-progress: true

jobs:
  publish-web-app:
    name: Publish Web App Branch
    # Validation calls this after a successful promotion or a validated master push.
    if: inputs.promoted || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      ORG_GRADLE_PROJECT_BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
      WEB_CUSTOM_DOMAIN: ${{ vars.WEB_CUSTOM_DOMAIN }}

    steps:
      # This trusted publication job needs Git authentication to fetch and push the web-app branch.
      - name: Checkout Master # zizmor: ignore[artipacked]
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Set up JDK 21
        if: inputs.artifact_name == ''
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        if: inputs.artifact_name == ''
        uses: gradle/actions/setup-gradle@v6

      - name: Validate Web Configuration
        run: |
          if [ -z "$ORG_GRADLE_PROJECT_BACKEND_BASE_URL" ]; then
            echo "Repository secret BACKEND_BASE_URL is required." >&2
            exit 1
          fi

      - name: Build Production Web App
        if: inputs.artifact_name == ''
        run: ./gradlew :webApp:wasmJsBrowserDistribution --stacktrace

      - name: Download Validated Web App
        if: inputs.artifact_name != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: webApp/build/dist/wasmJs/productionExecutable

      - name: Publish Web App Branch
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          publish_dir="$RUNNER_TEMP/web-app"
          mkdir -p "$publish_dir"
          cp -R webApp/build/dist/wasmJs/productionExecutable/. "$publish_dir/"

          web_app_ref="$(git ls-remote --heads origin refs/heads/web-app)"
          if [ -n "$web_app_ref" ]; then
            git fetch --no-tags --depth=1 origin refs/heads/web-app:refs/remotes/origin/web-app
            git switch --create web-app origin/web-app
            git rm -r --ignore-unmatch .
          else
            git switch --orphan web-app
          fi
          git clean -fdx
          cp -R "$publish_dir/." .
          touch .nojekyll
          if [ -n "$WEB_CUSTOM_DOMAIN" ]; then
            printf '%s\n' "$WEB_CUSTOM_DOMAIN" > CNAME
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "::notice::Web app branch already contains this publication."
            exit 0
          fi
          git commit -m "deploy(web): publish $SOURCE_SHA"
          git push origin HEAD:refs/heads/web-app
