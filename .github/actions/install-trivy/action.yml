# SPDX-License-Identifier: MPL-2.0

name: Install Trivy
description: >
  Installs the pinned Trivy release for aquasecurity/trivy-action with skip-setup-trivy. The download is retried, so a
  transient network error does not fail the scan before it runs, and the archive must match its pinned checksum.

runs:
  using: composite
  steps:
    - name: Download and Verify Trivy
      shell: bash
      env:
        # Keep the version that trivy-action uses by default; update the checksum from the release's checksums file.
        TRIVY_VERSION: 0.70.0
        TRIVY_SHA256: 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9
      run: |
        set -euo pipefail
        file="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
        archive="$RUNNER_TEMP/$file"
        extract_dir="$RUNNER_TEMP/trivy-bin"
        curl --fail --silent --show-error --location \
          --connect-timeout 10 --max-time 120 \
          --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 300 \
          --output "$archive" \
          "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$file"
        printf '%s  %s\n' "$TRIVY_SHA256" "$archive" | sha256sum --check --strict
        mkdir -p "$extract_dir"
        tar -xzf "$archive" -C "$extract_dir" trivy
        # /usr/local/bin is already on PATH, so the verified binary needs no environment-file change.
        sudo install -m 0755 "$extract_dir/trivy" /usr/local/bin/trivy
        trivy --version
