<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Resolves the page's files from the site root even when a deep link such as /game/42 is opened directly. -->
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- GitHub Pages cannot send headers, so the policy is set here. The backend origin is filled in at build time.
         Compose starts a worker from a blob: URL and downloads fallback fonts from fonts.gstatic.com for glyphs that
         the bundled fonts lack; IGDB serves game covers. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.braindancegg.com https://images.igdb.com https://fonts.gstatic.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
    <meta name="description" content="Braindance helps you discover games: what is popular right now, the most anticipated releases, similar games, and current free giveaways.">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#171717">
    <link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
    <title>Braindance</title>
    <style>
        html,
        body,
        #webApp {
            width: 100%;
            height: 100%;
        }

        /* Matches the app background so no white page shows before the Wasm bundle renders. */
        html,
        body {
            background-color: #171717;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <noscript>Braindance needs JavaScript and a browser with WebAssembly garbage collection, such as current Chrome, Edge, Firefox, or Safari.</noscript>
    <div id="webApp"></div>
    <script src="webApp-0.9.0.js"></script>
</body>
</html>
