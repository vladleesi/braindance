<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Resolves the page's files from the site root even when a deep link such as /game/42 is opened directly. -->
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- GitHub Pages cannot send headers, so the policy is set here. The backend origin is filled in at build time.
         Compose starts a worker from a blob: URL and downloads fallback fonts from fonts.gstatic.com for glyphs that
         the bundled fonts lack; IGDB serves game covers. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.braindancegg.com https://images.igdb.com https://fonts.gstatic.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
    <meta name="description" content="Braindance helps you discover games: what is popular right now, the most anticipated releases, similar games, and current free giveaways.">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#171717">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
    <link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png">
    <!-- Text needs these, but the app requests them only after the Wasm bundle starts; preloading downloads them in
         parallel with it. Each URL matches the app's request exactly, including its version query. -->
    <link rel="preload" href="composeResources/dev.vladleesi.braindanceapp.resources/font/poppins_regular.ttf?v=0.11.1" as="fetch" crossorigin>
    <link rel="preload" href="composeResources/dev.vladleesi.braindanceapp.resources/font/poppins_medium.ttf?v=0.11.1" as="fetch" crossorigin>
    <link rel="preload" href="composeResources/dev.vladleesi.braindanceapp.resources/font/poppins_semibold.ttf?v=0.11.1" as="fetch" crossorigin>
    <link rel="preload" href="composeResources/dev.vladleesi.braindanceapp.resources/values/strings.commonMain.cvr?v=0.11.1" as="fetch" crossorigin>
    <title>Braindance</title>
    <style>
        html,
        body,
        #webApp {
            width: 100%;
            height: 100%;
        }

        /* Matches the app background so no white page shows before the Wasm bundle renders. */
        html,
        body {
            background-color: #171717;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* Matches the app's own loading indicator, so the hand-off to the first Compose frame is seamless. */
        .boot {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .boot-spinner {
            box-sizing: border-box;
            width: 64px;
            height: 64px;
            border: 4px solid #2f2f2f;
            border-top-color: #efefef;
            border-radius: 50%;
            animation: boot-spin 1s linear infinite;
        }

        @keyframes boot-spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .boot-spinner {
                animation-duration: 3s;
            }
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <noscript>Braindance needs JavaScript and a browser with WebAssembly garbage collection, such as current Chrome, Edge, Firefox, or Safari.</noscript>
    <div id="webApp">
        <!-- Shown while the Wasm bundle downloads; Compose clears this container when it starts. -->
        <div class="boot" role="status">
            <div class="boot-spinner"></div>
            <span class="visually-hidden">Loading Braindance…</span>
        </div>
    </div>
    <script src="webApp-0.11.1.js"></script>
</body>
</html>
