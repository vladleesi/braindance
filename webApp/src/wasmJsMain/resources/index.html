<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#171717">
    <link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
    <title>Braindance</title>
    <style>
        html,
        body,
        #webApp {
            width: 100%;
            height: 100%;
        }

        /* Matches the app background so no white page shows before the Wasm bundle renders. */
        html,
        body {
            background-color: #171717;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="webApp"></div>
    <script src="${webBundleName}"></script>
</body>
</html>
