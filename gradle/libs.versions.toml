[versions]
gradle = "9.5.1"
kotlin = "2.4.21"
coroutines = "1.11.0"
compose-plugin = "1.12.2"
ktlint = "14.2.0"
detekt = "1.23.8"
ktor = "3.6.1"
activity-compose = "1.13.0"
compose = "1.12.2"
compose-android = "1.12.1"
material3 = "1.12.0-alpha03"
lifecycle = "2.11.0"
coil3 = "3.6.3"
buildkonfig = "0.23.0"
datetime = "0.8.0"
koin = "4.2.2"
nav3 = "1.2.0"
benchmark = "1.5.0"
profileinstaller = "1.4.1"
uiautomator = "2.4.1"
bouncycastle = "1.85"
logback = "1.5.34"
# Used directly by the Wasm Yarn resolution in the root build.gradle.kts.
#noinspection UnusedVersionCatalogEntry
ws = "8.21.0"

[libraries]

# compose
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose-android" }
compose-ui-multiplatform = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-material = { module = "org.jetbrains.compose.material:material", version.ref = "compose" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-material3-navigation-suite = { module = "org.jetbrains.compose.material3:material3-adaptive-navigation-suite", version.ref = "material3" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose" }
compose-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
compose-lifecycle = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

# compose navigation
compose-navigation3 = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "nav3" }
compose-navigation3-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }

# security

# ktor
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-serialization = { module = "io.ktor:ktor-client-serialization", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# datetime
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }

# serialization
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.13.0" }

# coroutines
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# coil
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil3" }
coil-network-ktor = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil3" }

# logger
logging-napier = { module = "io.github.aakira:napier", version = "2.7.1" }

# Sharing
sharekit = { module = "dev.vladleesi:kmp-sharekit", version = "0.2.0" }

# koin
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-compose-viewmodel-navigation = { module = "io.insert-koin:koin-compose-viewmodel-navigation", version.ref = "koin" }

# tests
unit-tests-junit = { module = "junit:junit", version = "4.13.2" }
unit-tests-kotlin = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

# startup performance
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
# Raises benchmark 1.5.0's transitive Wire runtime past GHSA-9rm7-3qhh-h2mc (fixed in 6.4.5).
wire-runtime = { module = "com.squareup.wire:wire-runtime", version = "6.4.7" }

# ui-tests
androidx-tests-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-tests-runner = { module = "androidx.test:runner", version = "1.7.0" }
androidx-tests-ext-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
android-tests-espresso = { module = "androidx.test.espresso:espresso-core", version = "3.7.0" }

# build tool security floors
# AGP, Android lint, ktlint, and Kotlin's Swift export bring these transitively; nothing here ships in an app. The root
# build.gradle.kts constrains those classpaths to at least these versions, each the first release fixing the
# advisories listed (2026-11-08 Dependabot alerts).
# GHSA-9pwp-9qqc-pr26, GHSA-qp49-qgx5-5m26, GHSA-wg6q-6289-32hp; bcutil stays aligned with bcprov and bcpkix.
tool-bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
tool-bouncycastle-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
tool-bouncycastle-bcutil = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "bouncycastle" }
# GHSA-xxph-c9ww-hj94
tool-guava = { module = "com.google.guava:guava", version = "33.7.2-jre" }
# GHSA-3677-xxcr-wjqv
tool-jose4j = { module = "org.bitbucket.b_c:jose4j", version = "0.9.6" }
# GHSA-2363-cqg2-863c
tool-jdom2 = { module = "org.jdom:jdom2", version = "2.0.6.1" }
# GHSA-jhq6-gfmj-v8fx and earlier logback-core advisories; classic stays aligned with core.
tool-logback-core = { module = "ch.qos.logback:logback-core", version.ref = "logback" }
tool-logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
# GHSA-ccrj-gw8r-854m, GHSA-rcgg-9c38-7xpx
tool-opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version = "1.67.0" }
# GHSA-j288-q9x7-2f5v
tool-commons-lang3 = { module = "org.apache.commons:commons-lang3", version = "3.18.0" }
# GHSA-7r82-7xv7-xcpj
tool-httpclient = { module = "org.apache.httpcomponents:httpclient", version = "4.5.14" }

[bundles]
tool-security-floors = [
    "tool-bouncycastle-bcprov",
    "tool-bouncycastle-bcpkix",
    "tool-bouncycastle-bcutil",
    "tool-guava",
    "tool-jose4j",
    "tool-jdom2",
    "tool-logback-core",
    "tool-logback-classic",
    "tool-opentelemetry-api",
    "tool-commons-lang3",
    "tool-httpclient",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "gradle" }
android-test = { id = "com.android.test", version.ref = "gradle" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "gradle" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-plugin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
buildkonfig = { id = "com.codingfeline.buildkonfig", version.ref = "buildkonfig" }
