# SPDX-License-Identifier: MPL-2.0
# The Braindance API as the open-source clients use it. ApiContractTest fails when this file and the client's
# endpoints or models disagree; update both together.
openapi: 3.1.0
info:
  title: Braindance API (client contract)
  version: v1
  description: >-
    Read-only JSON API that serves game data from IGDB and giveaways from GamerPower. Responses may contain fields
    not listed here; clients ignore them. Clients retry 502, 503, and 504 and treat 429 as rate limiting.
servers:
  - url: https://api.example.com
paths:
  /health:
    get:
      summary: Reachability check sent at app start. The body is not part of the contract.
      responses:
        '200':
          description: The API is reachable.
  /v1/games/trending:
    get:
      summary: Popular Right Now, ranked by the API, 20 games per page.
      parameters:
        - $ref: '#/components/parameters/FeedPage'
      responses:
        '200':
          description: Ranked game cards.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrendingGameItem'
  /v1/games/anticipated:
    get:
      summary: Most Anticipated, as compact cards with id, name, and cover only.
      parameters:
        - $ref: '#/components/parameters/FeedPage'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: >-
            Upcoming games. Pages after the first need pageSize 20 and must start within the first 200 games; a short
            page is the last one.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameItem'
        '400':
          description: The page or page size is invalid.
  /v1/games/details:
    get:
      summary: One game's details, with where it belongs among IGDB's related entries.
      description: >-
        IGDB lists a game's editions, updates, and add-ons as separate entries. Editions and updates are variants:
        clients show them on their canonical game's page with the variant selected. The response keeps the requested
        entry at the top level, so a variant's own fields describe the selection.
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: >-
            A list with the game, or an empty list when the ID is unknown. When the API cannot load a variant's
            canonical game, the variant comes without canonical_id, canonical, and family, and clients show it as a
            game of its own.
          content:
            application/json:
              schema:
                type: array
                maxItems: 1
                items:
                  $ref: '#/components/schemas/GameItem'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/games/recommendations:
    get:
      summary: Similar games, ranked by the API.
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Similar games; empty when there are none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SimilarGame'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/games/search:
    get:
      summary: Games whose titles match a search, best match first, one page at a time.
      description: >-
        Results come from one ranking per query, so pages never overlap. A page shorter than pageSize is the last; a
        page must start within the first 200 results. Clients send q, page, and pageSize in this order, with q in
        normalized form, so equal searches share a cache entry; other forms are answered but not cached publicly.
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Compact cards with id, name, cover, and first_release_date; empty past the last result.
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  $ref: '#/components/schemas/GameItem'
        '400':
          description: The query is missing or invalid, or the page is out of range.
  /v1/giveaways:
    get:
      summary: All current giveaways.
      responses:
        '200':
          description: Giveaways.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GiveawayResponse'
  /v1/giveaways/{id}:
    get:
      summary: One giveaway.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The giveaway.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiveawayResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No giveaway has this ID.
components:
  parameters:
    GameId:
      name: id
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
    PageSize:
      name: pageSize
      in: query
      description: Maximum number of cards. Clients always send it.
      schema:
        type: integer
        minimum: 1
        maximum: 50
    FeedPage:
      name: page
      in: query
      description: >-
        1-based page number of a feed. Clients leave it out for the first page, so it shares one cached URL with Home.
      schema:
        type: integer
        minimum: 1
    Page:
      name: page
      in: query
      description: 1-based page number. Clients always send it.
      schema:
        type: integer
        minimum: 1
    SearchQuery:
      name: q
      in: query
      required: true
      description: >-
        Search text in normalized form: lowercase, with double quotes, backslashes, and control characters replaced by
        spaces, whitespace runs collapsed to one space, and no space at either end. It needs a letter or digit.
      schema:
        type: string
        minLength: 2
        maxLength: 64
  responses:
    BadRequest:
      description: The ID is missing or invalid.
  schemas:
    TrendingGameItem:
      type: object
      required: [id]
      properties:
        id:
          type: integer
        name:
          type: string
        cover:
          $ref: '#/components/schemas/Cover'
        reason:
          type: string
          description: Why the game is trending, such as new_release, full_release, showcased, or new_platform.
        platform:
          type: string
          description: Short platform name, sent only with new_platform.
    GameItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        cover:
          $ref: '#/components/schemas/Cover'
        first_release_date:
          type: integer
          description: Unix time in seconds.
        release_dates:
          type: array
          items:
            $ref: '#/components/schemas/ReleaseDate'
        genres:
          type: array
          items:
            $ref: '#/components/schemas/Genre'
        platforms:
          type: array
          items:
            $ref: '#/components/schemas/Platform'
        websites:
          type: array
          items:
            $ref: '#/components/schemas/Websites'
        screenshots:
          type: array
          items:
            $ref: '#/components/schemas/Screenshot'
        videos:
          type: array
          items:
            $ref: '#/components/schemas/Video'
        summary:
          type: string
        storyline:
          type: string
        kind:
          type: string
          description: >-
            Game details only. What the entry is: edition or update for a variant of another game, otherwise its
            IGDB type, such as game, dlc, expansion, bundle, remake, remaster, or port. Clients treat unknown values
            as other.
        canonical_id:
          type: integer
          description: >-
            Game details only. The game whose page shows this entry: an edition's or update's game, otherwise the
            entry itself.
        canonical:
          $ref: '#/components/schemas/GameItem'
          description: Game details only. The canonical game's details, sent only when it is not this entry.
        family:
          $ref: '#/components/schemas/GameFamily'
    GameFamily:
      type: object
      description: Game details only. The canonical game's related entries, at most 50 per list, oldest first.
      properties:
        parent:
          $ref: '#/components/schemas/FamilyGame'
          description: The game a DLC, remaster, or port belongs to.
        variants:
          type: array
          description: Editions and updates, shown on the canonical game's page.
          items:
            $ref: '#/components/schemas/FamilyGame'
        extras:
          type: array
          description: DLC, expansions, packs, episodes, and seasons.
          items:
            $ref: '#/components/schemas/FamilyGame'
        other_versions:
          type: array
          description: Remakes, remasters, expanded games, ports, forks, and standalone expansions.
          items:
            $ref: '#/components/schemas/FamilyGame'
        included_in:
          type: array
          description: Bundles that contain the game, except its own editions.
          items:
            $ref: '#/components/schemas/FamilyGame'
        contents:
          type: array
          description: The games a bundle contains.
          items:
            $ref: '#/components/schemas/FamilyGame'
    FamilyGame:
      type: object
      required: [id, name, kind]
      properties:
        id:
          type: integer
        name:
          type: string
        kind:
          type: string
        label:
          type: string
          description: A short name on the canonical game's page, sent only for variants, extras, and other versions.
        cover:
          $ref: '#/components/schemas/Cover'
        first_release_date:
          type: integer
          description: Unix time in seconds.
    SimilarGame:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        cover:
          $ref: '#/components/schemas/Cover'
    Cover:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
          description: Protocol-relative IGDB image URL at t_thumb size; clients derive the sizes they show.
    ReleaseDate:
      type: object
      properties:
        id:
          type: integer
        human:
          type: string
          description: Human-readable release date, such as Q3 2027.
    Genre:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
    Platform:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
    Websites:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
          description: Clients open only HTTPS links.
        type:
          type: integer
          description: IGDB website type, such as 13 for Steam.
    Screenshot:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
        animated:
          type: boolean
    Video:
      type: object
      properties:
        id:
          type: integer
        video_id:
          type: string
    GiveawayResponse:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        worth:
          type: string
          description: Price text, or N/A when unknown.
        thumbnail:
          type: string
        image:
          type: string
        description:
          type: string
        instructions:
          type: string
        open_giveaway_url:
          type: string
        open_giveaway:
          type: string
        gamerpower_url:
          type: string
        published_date:
          type: string
          description: YYYY-MM-DD HH:MM:SS.
        end_date:
          type: string
          description: YYYY-MM-DD HH:MM:SS, or N/A when open-ended.
        type:
          type: string
          description: Such as Game, DLC, or Early Access.
        platforms:
          type: string
          description: Comma-separated platform names.
        users:
          type: integer
          description: How many people claimed it.
        status:
          type: string
